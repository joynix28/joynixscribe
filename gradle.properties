# Limites mémoire volontairement basses : la machine héberge aussi des services.
# Un build Android qui part en vrille peut consommer plusieurs Go d'un coup.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.daemon=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
