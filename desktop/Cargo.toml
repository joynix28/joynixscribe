[package]
name = "joynixscribe-desktop"
version = "2.2.0"
edition = "2021"

[dependencies]
eframe = "0.29"
egui = "0.29"
cpal = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigo = "0.2"
hound = "3.5"
base64 = "0.22"
arboard = "3"

[[bin]]
name = "JoynixScribe"
path = "src/main.rs"
